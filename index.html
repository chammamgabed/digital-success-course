<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  <title>Digital Success Course</title>  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
    }

    .container {
      max-width: 700px;
      margin: 80px auto;
      padding: 40px 20px;
      text-align: center;
    }

    .card {
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 15px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
    }

    .price {
      font-size: 32px;
      font-weight: bold;
      margin: 25px 0;
    }

    #buy-button {
      background: #111;
      color: white;
      border: none;
      padding: 15px 35px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
    }

    #buy-button:hover {
      opacity: 0.85;
    }
  </style></head><body>  <div class="container">
    <div class="card">  <h1>Digital Success Course</h1>

  <p>
    Learn practical strategies and tools to build and grow
    your digital business.
  </p>

  <div class="price">$9.99</div>

  <button id="buy-button">
    Buy Now
  </button>

</div>

  </div>  <script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>  <script>
    Paddle.Initialize({
      token: "live_4173dcffcf5df911130a3c02ded",

      eventCallback: function (data) {

        if (data.name === "checkout.completed") {

          const transactionId = data.data.transaction_id;

          window.location.href =
            "https://chammamgabed.github.io/digital-success-course/success.html?transaction_id="
            + encodeURIComponent(transactionId);
        }
      }
    });

    document
      .getElementById("buy-button")
      .addEventListener("click", function () {

        Paddle.Checkout.open({

          settings: {
            locale: "en"
          },

          customData: {
            course: "digital-success-course"
          },

          items: [
            {
              priceId: "pri_01m45y90en4j65frbwgf6q176q",
              quantity: 1
            }
          ]

        });

      });
  </script></body>
</html>
