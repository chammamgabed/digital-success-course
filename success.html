<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Digital Success Course</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
      text-align: center;
    }

    .container {
      max-width: 700px;
      margin: 100px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 45px 30px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.08);
    }

    h1 {
      margin-bottom: 20px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
    }

    .course-button {
      display: inline-block;
      margin-top: 25px;
      padding: 15px 30px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 18px;
    }

    #status {
      margin-top: 25px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <div class="container">
    <div class="card">

      <h1>🎉 Payment Successful!</h1>

      <p>
        Thank you for purchasing Digital Success Course.
      </p>

      <p id="status">
        Verifying your payment...
      </p>

      <a
        id="course-button"
        class="course-button"
        href="#"
        style="display:none;"
      >
        Access Your Course
      </a>

    </div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const transactionId = params.get("transaction_id");

    const status = document.getElementById("status");
    const courseButton = document.getElementById("course-button");

    if (!transactionId) {

      status.textContent =
        "Transaction ID is missing. Please contact support.";

    } else {

      fetch(
        "https://paddle-webhook-q8oi.onrender.com/verify?transaction_id="
        + encodeURIComponent(transactionId)
      )

      .then(response => response.json())

      .then(data => {

        if (data.success && data.access) {

          status.textContent =
            "Payment verified. Your course is ready.";

          courseButton.href =
            "https://paddle-webhook-q8oi.onrender.com/course?transaction_id="
            + encodeURIComponent(transactionId);

          courseButton.style.display = "inline-block";

        } else {

          status.textContent =
            "Payment could not be verified.";

        }

      })

      .catch(error => {

        console.error(error);

        status.textContent =
          "Unable to verify payment. Please try again.";

      });
    }
  </script>

</body>
</html>
